name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and repository validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify pinned Libft dependency
        shell: bash
        run: |
          set -euo pipefail

          expected=$(git ls-tree HEAD external/libft | awk '{print $3}')
          actual=$(git -C external/libft rev-parse HEAD)

          echo "superproject pin: $expected"
          echo "submodule HEAD:   $actual"

          test -n "$expected"
          test "$expected" = "$actual"
          test -f external/libft/libft/Makefile
          test -f external/libft/libft/libft.h
          test ! -d libft

      - name: Check patch whitespace
        run: git diff --check

      - name: Mandatory clean build
        shell: bash
        run: |
          set -euo pipefail
          make fclean
          make

      - name: Bonus clean build
        shell: bash
        run: |
          set -euo pipefail
          make fclean
          make bonus

      - name: Validate mandatory to bonus switching
        shell: bash
        run: |
          set -euo pipefail
          make fclean
          make
          make bonus
          test -f .build-state/bonus
          test ! -f .build-state/mandatory

      - name: Validate bonus to mandatory switching
        shell: bash
        run: |
          set -euo pipefail
          make fclean
          make bonus
          make
          test -f .build-state/mandatory
          test ! -f .build-state/bonus

      - name: Validate clean then build
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make

      - name: Validate fclean then re
        shell: bash
        run: |
          set -euo pipefail
          make fclean
          make re

      - name: Verify repository cleanliness after build
        shell: bash
        run: |
          set -euo pipefail

          super_status=$(git status --porcelain)
          submodule_status=$(git -C external/libft status --porcelain)

          if [ -n "$super_status" ]; then
            echo "Superproject is dirty:"
            printf '%s\n' "$super_status"
            exit 1
          fi

          if [ -n "$submodule_status" ]; then
            echo "Libft submodule is dirty:"
            printf '%s\n' "$submodule_status"
            exit 1
          fi

      - name: Clean generated artifacts
        run: make fclean

      - name: Verify repository cleanliness after fclean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test -z "$(git -C external/libft status --porcelain)"

  clang:
    name: Clang compiler validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Mandatory Clang build
        shell: bash
        run: |
          set -euo pipefail
          make fclean
          make CC=clang

      - name: Bonus Clang build
        shell: bash
        run: |
          set -euo pipefail
          make fclean
          make CC=clang bonus

      - name: Clean
        run: make fclean

  runtime:
    name: Runtime regression validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Run bounded regression suite
        shell: bash
        run: timeout 30s ./tests/regression.sh

      - name: Verify repository cleanliness
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test -z "$(git -C external/libft status --porcelain)"

  documentation:
    name: Documentation validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install documentation dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes doxygen

      - name: Validate interface documentation
        shell: bash
        run: |
          set -euo pipefail

          rm -rf docs/mandatory docs/bonus

          doxygen Doxyfile
          doxygen Doxyfile.bonus

          test -f docs/mandatory/index.html
          test -f docs/bonus/index.html

          for symbol in \
            t_server \
            t_client \
            ft_error \
            bit_idx \
            signal_ready \
            bit_ack_received
          do
            if ! grep -RFl "$symbol" docs/mandatory >/dev/null 2>&1; then
              echo "Mandatory documentation is missing: $symbol"
              exit 1
            fi
          done

          if grep -RIE             '(^|[^[:alnum:]_])ack_received([^[:alnum:]_]|$)'             docs/mandatory >/dev/null 2>&1
          then
              echo "Mandatory documentation unexpectedly exposes ack_received"
              exit 1
          fi

          for symbol in \
            t_server \
            t_client \
            ft_error \
            bit_idx \
            signal_ready \
            bit_ack_received \
            ack_received
          do
            if ! grep -RFl "$symbol" docs/bonus >/dev/null 2>&1; then
              echo "Bonus documentation is missing: $symbol"
              exit 1
            fi
          done

          rm -rf docs/mandatory docs/bonus

          test ! -e docs/mandatory
          test ! -e docs/bonus
          test -f docs/academic/README.md
          test -f docs/assets/42-evaluation.png

      - name: Verify repository cleanliness
        shell: bash
        run: |
          set -euo pipefail

          status_output="$(git status --porcelain --untracked-files=all)"
          submodule_status="$(git -C external/libft status --porcelain)"

          if [ -n "$status_output" ]; then
              echo "ERROR: documentation validation modified the repository:"
              printf '%s\n' "$status_output"
              exit 1
          fi

          if [ -n "$submodule_status" ]; then
              echo "ERROR: Libft submodule was modified:"
              printf '%s\n' "$submodule_status"
              exit 1
          fi

          ignored_output="$(git clean -ndX)"

          if [ -n "$ignored_output" ]; then
              echo "ERROR: ignored generated files remain:"
              printf '%s\n' "$ignored_output"
              exit 1
          fi

          echo "PASS: repository and Libft submodule remain clean"
